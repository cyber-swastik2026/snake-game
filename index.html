<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Snake Quest - Colorful Snake Game</title>
    <meta name="description" content="A colorful Snake game with 16 modes, themes, speeds and board sizes. Play free in your browser.">
    <meta property="og:title" content="Snake Quest">
    <meta property="og:description" content="Colorful Snake game with 16 modes.">
    <link rel="icon" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Google AdSense Correct Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4023447827254400" crossorigin="anonymous"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <aside id="side"><button id="bSide"><b>≡</b><span>Menu</span></button><button id="bInfo"><b>i</b><span>About</span></aside>
    <div id="app">
        <header id="top"><div id="score"><span id="sfruit">🍎</span><b id="sval">0</b></div></header>
        <div class="tb"><button id="bOp" title="D-pad">🎮</button><button id="bHelp" title="Help">?</button><button id="bSet" title="Settings">⚙️</button><button id="bfs" title="Fullscreen">⛶</button></div>
        <main id="stage"><canvas id="cv"></canvas></main>
        <div id="dpad"><button data-d="0" style="grid-area:u">▲</button><button data-d="3" style="grid-area:l">◀</button><button data-d="1" style="grid-area:r">▶</button><button data-d="2" style="grid-area:d">▼</button></div>
        <nav id="modes"></nav>
        <div id="modal" hidden><div class="panel"><div id="mbody"></div><div class="btns"><button id="mclose" class="green big">Got it</button></div></div></div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
